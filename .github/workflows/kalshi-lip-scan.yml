name: Kalshi LIP Market Scan

# Weekly discovery of Kalshi Liquidity Incentive Program (LIP) markets.
# Read-only: hits Kalshi's public incentive_programs endpoint, uses no
# credentials, places no orders. Produces a ranked digest the LIP bot can
# focus on. Runs Sundays ~08:13 ET (12:13 UTC).

on:
  schedule:
    - cron: '13 12 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run Kalshi LIP market scan
        # The monitor uses only the Python standard library (urllib/csv/json),
        # so no dependency install step is required.
        run: |
          set -euo pipefail
          mkdir -p data/kalshi-rewards
          # The scan monitor (scripts/kalshi_rewards_monitor.py) is a follow-up to
          # this PR. Skip gracefully until it lands so the weekly cron does not fail.
          if [ -f scripts/kalshi_rewards_monitor.py ]; then
            python scripts/kalshi_rewards_monitor.py --limit 25
            {
              echo "## Kalshi LIP Market Scan"
              echo ""
              cat data/kalshi-rewards/latest.md
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Kalshi LIP Market Scan"
              echo ""
              echo "_Monitor script \`scripts/kalshi_rewards_monitor.py\` not present yet — scan skipped._"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload digest artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kalshi-lip-digest
          path: data/kalshi-rewards/
          retention-days: 30
          if-no-files-found: ignore
