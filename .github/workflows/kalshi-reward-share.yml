name: Kalshi LIP qualifying-share log

# Daily public-data measurement of expected LIP share. No credentials, no orders.
# Complements the weekly market digest in kalshi-lip-scan.yml.

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Log qualifying share
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/kalshi_reward_share.py --limit 25 --out artifacts/kalshi-reward-share-live.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kalshi-reward-share
          path: artifacts/kalshi-reward-share-live.*
          retention-days: 30
          if-no-files-found: warn
