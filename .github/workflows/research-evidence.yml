name: Offline research evidence
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: research-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate synthetic evidence with standard library only
        run: >-
          python research_evidence.py tests/fixtures/research-evidence.jsonl
          --sha256 97b8a9fb9aa4e7a11551abc969d952acc260661a69b421aeb87434e160e3e809
          --cutoff 2026-09-30T00:00:00Z --synthetic
          --output research-output/fixture-validation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-research-fixture
          path: research-output/fixture-validation.json
          retention-days: 7
          if-no-files-found: error
  attest:
    needs: evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: offline-research-fixture
          path: research-output
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: research-output/fixture-validation.json
